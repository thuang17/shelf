<h2>Shelf 应该给人什么感觉？</h2>
<p class="subtitle">选一个你想要的视觉风格方向</p>

<div class="options">
  <div class="option" data-choice="netflix" onclick="toggleSelect(this)">
    <div class="letter">A</div>
    <div class="content">
      <h3>Netflix 沉浸式</h3>
      <p>全屏暗色、大封面图、横向滑动 row、hover 放大、video-player 式氛围。强调封面视觉冲击力。</p>
    </div>
  </div>
  <div class="option" data-choice="letterboxd" onclick="toggleSelect(this)">
    <div class="letter">B</div>
    <div class="content">
      <h3>Letterboxd 极简</h3>
      <p>大量留白、细腻排版、小尺寸卡片、杂志感。适合慢节奏浏览，设计感强但不张扬。</p>
    </div>
  </div>
  <div class="option" data-choice="app" onclick="toggleSelect(this)">
    <div class="letter">C</div>
    <div class="content">
      <h3>iOS 式精致 App</h3>
      <p>圆角卡片、毛玻璃效果、微妙阴影、弹入动画、SF-style 字体排版。像原生 App 一样精致。</p>
    </div>
  </div>
  <div class="option" data-choice="brutal" onclick="toggleSelect(this)">
    <div class="letter">D</div>
    <div class="content">
      <h3>Bento Grid 现代风</h3>
      <p>网格布局、卡片式信息分组、多彩点缀、动感交互。适合内容密度高但不杂乱的设计。</p>
    </div>
  </div>
</div>
