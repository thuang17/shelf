      <div style="font-size:13px;color:rgba(255,255,255,0.85);margin-bottom:16px">shelf / Trevor</div>

<p style="color:#888;font-size:12px;margin-top:12px">区别很微妙。有光晕 = 背景有"呼吸感"，不死黑。无光晕 = 更干净更平。你喜欢哪个？</p>

<div class="options">

    <div class="letter">A</div>

  </div>
  <div class="option" data-choice="no-glow" onclick="toggleSelect(this)">
